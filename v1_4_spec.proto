// This schema defines the wire format for the Large Message Handling extension.
// It ensures that different implementations (Python, Nim, Go) can interoperate
// at the bit-level while handling segmented data.

// Note: The Python simulation uses dataclasses for zero-dependency runtime, 
// but this file serves as the canonical specification for production builds.

syntax = "proto3";

package gossipsub.v1_4;

option go_package = "github.com/libp2p/go-libp2p-pubsub/gossipsub/v1_4";

// SegmentEnvelope is the primary unit of data moving through the mesh.
// It is designed to be self-sufficient; a receiver can determine the 
// full message context from any single received chunk.
message SegmentEnvelope {

  // msg_id: A UUID v4 string. Used to route arriving segments into 
  // the correct buffer since multiple messages may be in-flight.
  string msg_id = 1;

  // total_segments: The count of primary data chunks. Used for 
  // buffer pre-allocation and completion detection.
  uint32 total_segments = 2;

  // segment_index: Zero-based index used as the key for reassembly. 
  // Values >= total_segments are treated as parity/redundancy data.
  uint32 segment_index = 3;

  // payload_hash: Hex-encoded SHA-256 for Tier 1 integrity checks. 
  // Allows immediate discarding of corrupt data before full reassembly.
  string payload_hash = 4;

  // payload: The raw binary data. Typically 512 bytes but can vary.
  bytes payload = 5;

  // is_parity: Flag for erasure coding. If true, the payload is an XOR 
  // result used to recover lost primary segments without a re-fetch.
  bool is_parity = 6;
}

// SegmentBatch allows grouping multiple envelopes into one transmission 
// to reduce framing overhead and improve mesh throughput.
message SegmentBatch {
  repeated SegmentEnvelope envelopes = 1;
}

// IWantSegments is a control message for selective re-fetching.
// Triggered when gap analysis identifies specific missing indices.
message IWantSegments {
  string msg_id = 1;
  repeated uint32 missing_indices = 2;
}

// ReconstructFail is an observability message emitted when a transfer 
// stalls and the buffer is evicted (e.g., due to TTL expiry).
message ReconstructFail {
  string msg_id = 1;
  repeated uint32 missing = 2;
  uint64 eviction_epoch = 3;
  string reason = 4; // Expected: "stale_ttl" or "dos_guard"
}
